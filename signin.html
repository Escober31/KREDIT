<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apply to be Staff/Admin — KreditCars</title>
  <meta name="description" content="Apply to be Staff or Admin at KreditCars" />
  <link rel="icon" href="images/KREDITCARS.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <!-- === NAV === -->
  <nav class="fixed top-0 left-0 w-full z-50 bg-transparent py-4">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-start gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <!-- SVG hexagon that clips the image inside and draws the orange border -->
        <svg viewBox="0 0 100 100" class="w-10 h-10" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KreditCars logo">
          <defs>
            <clipPath id="hexClipLogoLogin">
              <polygon points="25,6.7 75,6.7 100,50 75,93.3 25,93.3 0,50" />
            </clipPath>
          </defs>

          <!-- orange hex border -->
          <polygon points="25,6.7 75,6.7 100,50 75,93.3 25,93.3 0,50"
                   fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round" />

          <!-- logo image clipped into the hexagon -->
          <image href="images/KREDITCARS.png"
                 x="0" y="0" width="100" height="100"
                 preserveAspectRatio="xMidYMid slice"
                 clip-path="url(#hexClipLogoLogin)" />
        </svg>

        <div class="leading-tight">
          <div class="text-xl font-black tracking-wider italic">Kredit<span class="text-amber-500">Cars</span></div>
          <div class="text-xs text-cyan-400 uppercase tracking-widest">Trusted Pre-Owned Vehicles</div>
        </div>
      </a>

      <div class="hidden md:flex items-center gap-4">
      </div>
    </div>
  </nav>
  <!-- === end nav === -->

  <div class="w-full max-w-lg bg-[#0B1320]/80 border border-slate-800 p-6 rounded-lg mt-28 shadow-xl">
    <h1 class="text-2xl font-bold mb-4">Sign up to be Staff / Admin</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      <div class="grid grid-cols-3 gap-2 items-center">
        <div>
          <label class="block text-sm">Last Name</label>
          <input name="last_name" required class="mt-1 block w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-sm">First Name</label>
          <input name="first_name" required class="mt-1 block w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-sm">2x2 Photo</label>
          <input name="photo" type="file" accept="image/*" class="mt-1 block w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-slate-800 file:text-slate-200">
        </div>
      </div>

      <label class="block">
        <span class="text-sm">Email address</span>
        <input name="email" type="email" required class="mt-1 block w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
      </label>

      <label class="block">
        <span class="text-sm">Phone number</span>
        <input name="phone" class="mt-1 block w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
      </label>

      <label class="block">
        <span class="text-sm">Position</span>
        <select name="role" class="mt-1 block w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
      </label>

      <div class="flex gap-2 pt-2">
        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black px-4 py-2 rounded font-bold transition">Sign in</button>
        <a href="login.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded transition">Back</a>
      </div>
    </form>
  </div>
</body>
</html>
